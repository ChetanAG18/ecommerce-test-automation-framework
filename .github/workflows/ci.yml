name: Test Automation Workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '30 23 * * *'
      timezone: 'Asia/Kolkata'

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11 
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Running test automation framework with maven
      run: mvn test -X -DsuiteXmlFile=testng.xml -Dbrowser=chrome -DisLambdaTest=true -DisHeadless=false

    - name: Upload a log Artifact
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
          name: Test Logs
          path: logs/

    - name: Upload a report Artifact
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
          name: Test Report
          path: reports.html

    - name: Notification for execution status
      run: echo "Test Execution Completed"
