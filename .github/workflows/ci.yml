name: Test Automation Workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '30 23 * * *'
      timezone: 'Asia/Kolkata'

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11 
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Running test automation framework with maven
      run: mvn test -X -DsuiteXmlFile=testng.xml -Dbrowser=chrome -DisLambdaTest=true -DisHeadless=false

    - name: Upload Test Logs as Artifact
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
          name: Test Logs
          path: logs/

    - name: Upload Screenshots as Artifact
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
          name: screenshots
          path: screenshots/

    - name: Upload HTML Report as Artifact
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
          name: html-report
          path: reports.html

    - name: Copy Report to gh-pages folder
      if: always()
      run: |
        mkdir -p public/extent-reports/
        cp -R reports.html public/extent-reports/
        cp -R screenshots/ public/extent-reports/screenshots/
        ls -l

    # - name: Deploy to GitHub Pages
    #   if: always()
    #   uses: JamesIves/github-pages-deploy-action@v4.8.0
    #   with:
    #       folder: public/extent-reports/
    #       token: ${{ secrets.PAT }}
    #       clean: true

    - name: GitHub Pages action
      if: always()
      uses: peaceiris/actions-gh-pages@v4.1.0
      with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public/extent-reports/
          
    - name: Notification for execution status
      if: always()
      run: echo "Test Execution Completed"
